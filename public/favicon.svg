<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Selvania">
  <title>Selvania</title>

  <!-- El cuadrado es el lote y la hoja es la selva. A 16 px el detalle fino
       desaparece, así que la marca se apoya en dos siluetas macizas y en el
       contraste entre el verde profundo y el lima. -->
  <rect width="32" height="32" rx="7" fill="#0F1F16"/>

  <!-- Linderos del lote: apenas se intuyen al tamaño de pestaña, pero al
       ampliarlo dan la lectura de parcela. -->
  <rect x="5.5" y="5.5" width="21" height="21" rx="3.5"
        fill="none" stroke="#6EE12D" stroke-opacity="0.28" stroke-width="1.25"/>

  <!-- Hoja maciza, centrada en el lote. -->
  <g transform="translate(4.6 4.6) scale(0.94)">
    <path d="M11 20.5A7.5 7.5 0 0 1 9.7 6.3C15.4 5.2 17 4.6 19 2c1 2 2 4.2 2 8 0 5.8-4.7 10.5-10 10.5Z"
          fill="#6EE12D"/>
    <path d="M3 21c0-3.2 2-5.6 5.3-6.3C10.9 14.1 13 12.6 14 11.5"
          fill="none" stroke="#6EE12D" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
